name: Security Audit (reusable)

on:
  workflow_call:
    inputs:
      scan_type:
        description: "'secrets' | 'vuln' | 'all'"
        type: string
        default: 'all'
      url:
        description: 'URL à scanner pour les headers'
        type: string
        default: ''
      fail_on_critical:
        description: 'Echouer si CRITICAL trouvé'
        type: boolean
        default: true
      min_grade:
        description: 'Grade minimum (A/B/C/D/F)'
        type: string
        default: 'C'

permissions:
  contents: read

jobs:
  audit:
    name: Olik Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Valider les paramètres et le SHA du workflow appelé
        id: identity
        env:
          KIT_SHA: ${{ job.workflow_sha }}
          KIT_REPOSITORY: ${{ job.workflow_repository }}
          SCAN_TYPE: ${{ inputs.scan_type }}
          MIN_GRADE: ${{ inputs.min_grade }}
        shell: bash
        run: |
          [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::SHA du workflow appelé absent ou invalide'; exit 1; }
          [[ "$KIT_REPOSITORY" == 'olivierkathenis/olik-security-kit' ]] || { echo '::error::Dépôt du workflow inattendu'; exit 1; }
          case "$SCAN_TYPE" in secrets|vuln|all) ;; *) echo '::error::scan_type invalide'; exit 1 ;; esac
          case "$MIN_GRADE" in A|B|C|D|F) ;; *) echo '::error::min_grade invalide'; exit 1 ;; esac
          printf 'sha=%s\n' "$KIT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: olivierkathenis/olik-security-kit
          ref: ${{ steps.identity.outputs.sha }}
          path: olik-security-kit
          persist-credentials: false
      - name: Vérifier les scripts effectivement récupérés
        env:
          KIT_SHA: ${{ steps.identity.outputs.sha }}
        shell: bash
        run: |
          [[ "$(git -C olik-security-kit rev-parse HEAD)" == "$KIT_SHA" ]] || { echo '::error::Scripts au mauvais SHA'; exit 1; }
          printf 'SHA des scripts du kit : `%s`\n\n' "$KIT_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: olik-security-kit/package-lock.json
      - run: npm ci
        working-directory: olik-security-kit
      - name: Auditer et noter les rapports structurés complets
        env:
          SCAN_TYPE: ${{ inputs.scan_type }}
          MIN_GRADE: ${{ inputs.min_grade }}
          FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
          AUDIT_URL: ${{ inputs.url }}
          KIT_SHA: ${{ steps.identity.outputs.sha }}
          PROJECT_PATH: ${{ github.workspace }}/project
          REPORT_DIR: ${{ runner.temp }}/olik-security-audit-report
        run: node olik-security-kit/scripts/ci-audit.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: ${{ runner.temp }}/olik-security-audit-report/*.json
          retention-days: 30
